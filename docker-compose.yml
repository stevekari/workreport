version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: steveflow-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - JWT_SECRET=SteveFlowSuperSecretKeyChangeThisInProduction12345
    volumes:
      - steveflow_data:/app/data

volumes:
  steveflow_data:
    driver: local
