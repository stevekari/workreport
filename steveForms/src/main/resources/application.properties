spring.application.name=steveflow
# ===== SteveFlow - application settings =====

# Dynamic Port (Render provides $PORT, defaults to 8080)
server.port=${PORT:8080}

# H2 file database (data survives restarts). File is created in ./data/
spring.datasource.url=jdbc:h2:file:./data/steveflow;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 web console (open http://localhost:8080/h2-console to inspect data)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT secret - can be overridden with JWT_SECRET environment variable in production
jwt.secret=${JWT_SECRET:SteveFlowSuperSecretKeyChangeThisInProduction12345}
jwt.expiration-ms=86400000